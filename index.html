<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Login App</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #121212; 
            color: white; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .card { 
            background: #1e1e1e; 
            padding: 2.5rem; 
            border-radius: 16px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.6); 
            width: 100%; 
            max-width: 380px; 
            text-align: center; 
        }
        h2 { margin-bottom: 1.5rem; color: #f5820d; }
        input { 
            width: 100%; 
            padding: 12px; 
            margin: 10px 0; 
            border-radius: 8px; 
            border: 1px solid #333; 
            background: #2a2a2a; 
            color: white; 
            box-sizing: border-box; 
            outline: none;
        }
        input:focus { border-color: #f5820d; }
        button { 
            width: 100%; 
            padding: 12px; 
            margin-top: 12px; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 1rem;
            transition: transform 0.2s, background 0.2s; 
        }
        button:active { transform: scale(0.98); }
        #loginBtn { background-color: #f5820d; color: white; }
        #signUpBtn { background-color: transparent; color: #f5820d; border: 1px solid #f5820d; }
        #logoutBtn { background-color: #e74c3c; color: white; margin-top: 20px; }
        .hidden { display: none; }
        #status { margin-top: 20px; font-size: 0.85rem; min-height: 1.2rem; color: #ffcc00; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Firebase Auth</h2>
        
        <div id="authFields">
            <input type="email" id="email" placeholder="Email Address">
            <input type="password" id="password" placeholder="Password">
            <button id="loginBtn">Log In</button>
            <button id="signUpBtn">Create Account</button>
        </div>

        <div id="userProfile" class="hidden">
            <p>Welcome back!</p>
            <p><strong id="userEmailDisplay"></strong></p>
            <button id="logoutBtn">Log Out</button>
        </div>
        
        <p id="status"></p>
    </div>

    <script type="module">
        // Import only what we need from the official Google CDN
       // Import the functions you need from the SDKs you need
import { initializeApp } from "firebase/app";
import { getAnalytics } from "firebase/analytics";
// TODO: Add SDKs for Firebase products that you want to use
// https://firebase.google.com/docs/web/setup#available-libraries

// Your web app's Firebase configuration
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyDd8zrzECGZEw_dhc2IYqCWCHj8-0sBFL8",
  authDomain: "randomhtmlgrfn.firebaseapp.com",
  projectId: "randomhtmlgrfn",
  storageBucket: "randomhtmlgrfn.firebasestorage.app",
  messagingSenderId: "339398062606",
  appId: "1:339398062606:web:791d6373c611b2cb7f825f",
  measurementId: "G-6CCYWY5QM9"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);

        // UI Elements
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const statusMsg = document.getElementById('status');
        const authFields = document.getElementById('authFields');
        const userProfile = document.getElementById('userProfile');
        const userEmailDisplay = document.getElementById('userEmailDisplay');

        // Logic: Create New User
        document.getElementById('signUpBtn').addEventListener('click', () => {
            statusMsg.innerText = "Processing...";
            createUserWithEmailAndPassword(auth, emailInput.value, passwordInput.value)
                .catch((err) => statusMsg.innerText = "Error: " + err.message);
        });

        // Logic: Sign In
        document.getElementById('loginBtn').addEventListener('click', () => {
            statusMsg.innerText = "Logging in...";
            signInWithEmailAndPassword(auth, emailInput.value, passwordInput.value)
                .catch((err) => statusMsg.innerText = "Error: " + err.message);
        });

        // Logic: Log Out
        document.getElementById('logoutBtn').addEventListener('click', () => {
            signOut(auth).catch((err) => console.error(err));
        });

        // Logic: Monitor Auth State (Changes UI automatically)
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // User is logged in
                authFields.classList.add('hidden');
                userProfile.classList.remove('hidden');
                userEmailDisplay.innerText = user.email;
                statusMsg.innerText = "";
            } else {
                // User is logged out
                authFields.classList.remove('hidden');
                userProfile.classList.add('hidden');
                statusMsg.innerText = "";
            }
        });
    </script>
</body>
</html>
