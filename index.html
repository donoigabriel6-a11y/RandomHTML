<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Google Login</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #121212; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e1e1e; padding: 2.5rem; border-radius: 16px; box-shadow: 0 15px 35px rgba(0,0,0,0.6); width: 100%; max-width: 380px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #333; background: #2a2a2a; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; margin-top: 10px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        #loginBtn { background-color: #f5820d; color: white; }
        #googleBtn { background-color: #ffffff; color: #757575; border: 1px solid #ddd; display: flex; align-items: center; justify-content: center; gap: 10px; }
        #logoutBtn { background-color: #e74c3c; color: white; margin-top: 20px; }
        .hidden { display: none; }
        .divider { margin: 20px 0; border-top: 1px solid #444; position: relative; }
        .divider span { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); background: #1e1e1e; padding: 0 10px; color: #777; font-size: 0.8rem; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Welcome</h2>
        
        <div id="authFields">
            <input type="email" id="email" placeholder="Email Address">
            <input type="password" id="password" placeholder="Password">
            <button id="loginBtn">Log In</button>
            
            <div class="divider"><span>OR</span></div>
            
            <button id="googleBtn">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18">
                Sign in with Google
            </button>
        </div>

        <div id="userProfile" class="hidden">
            <p>Welcome back,</p>
            <p><strong id="userEmailDisplay"></strong></p>
            <button id="logoutBtn">Log Out</button>
        </div>
        
        <p id="status" style="color: #ffcc00; font-size: 0.8rem; margin-top: 15px;"></p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            signInWithEmailAndPassword, 
            signInWithPopup, 
            GoogleAuthProvider, 
            onAuthStateChanged, 
            signOut 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // CONFIG (Ensure this matches your Console exactly)
        const firebaseConfig = {
            apiKey: "AIzaSyDd8zrzECGZEw_dhc2IYqCWCHj8-0sBFL8",
            authDomain: "randomhtmlgrfn.firebaseapp.com",
            projectId: "randomhtmlgrfn",
            storageBucket: "randomhtmlgrfn.firebasestorage.app",
            messagingSenderId: "339398062606",
            appId: "1:339398062606:web:791d6373c611b2cb7f825f"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider(); // Google Provider instance

        const statusMsg = document.getElementById('status');

        // Google Login Logic
        document.getElementById('googleBtn').addEventListener('click', () => {
            signInWithPopup(auth, provider)
                .then((result) => {
                    console.log("Google Login Success:", result.user);
                })
                .catch((error) => {
                    statusMsg.innerText = error.message;
                });
        });

        // Email Login Logic
        document.getElementById('loginBtn').addEventListener('click', () => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            signInWithEmailAndPassword(auth, email, pass)
                .catch((err) => statusMsg.innerText = err.message);
        });

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));

        // Auth State Observer
        onAuthStateChanged(auth, (user) => {
            const authFields = document.getElementById('authFields');
            const userProfile = document.getElementById('userProfile');
            if (user) {
                authFields.classList.add('hidden');
                userProfile.classList.remove('hidden');
                document.getElementById('userEmailDisplay').innerText = user.email || user.displayName;
            } else {
                authFields.classList.remove('hidden');
                userProfile.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
